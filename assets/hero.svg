
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="330" viewBox="0 0 1200 330"
     role="img" aria-label="Noriaki Kishida engineering portfolio">
  <style>
    .orbit-tracer {
      transform-origin: 1010px 165px;
      animation: orbit 24s linear infinite;
    }
    .signal { animation: signal 4s ease-in-out infinite; }
    .signal-delayed { animation-delay: 2s; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes signal { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .orbit-tracer, .signal { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1420"/>
      <stop offset="100%" stop-color="#18283b"/>
    </linearGradient>
    <pattern id="grid" width="35" height="35"
             patternUnits="userSpaceOnUse">
      <path d="M35 0H0V35" fill="none"
            stroke="#7b91a3" stroke-opacity=".08"/>
    </pattern>
  </defs>

  <rect width="1200" height="330" rx="10"
        fill="url(#background)"/>
  <rect width="1200" height="330" rx="10"
        fill="url(#grid)"/>

  <!-- Editorial identity -->
  <rect x="55" y="43" width="6" height="13"
        rx="2" fill="#d7f58a"/>
  <text x="74" y="54" fill="#d7f58a"
        font-family="Arial,sans-serif"
        font-size="15" font-weight="bold"
        letter-spacing="3">
    N/K  /  ENGINEERING PORTFOLIO
  </text>

  <!-- Main typography -->
  <g font-family="Arial,Helvetica,sans-serif"
     font-weight="800" fill="#f5f5f0"
     letter-spacing="-3">
    <text x="55" y="138" font-size="79">NORIAKI</text>
    <text x="55" y="216" font-size="79">KISHIDA</text>
  </g>

  <circle cx="364" cy="201" r="7" fill="#d7f58a"/>

  <text x="57" y="264"
        font-family="Arial,sans-serif" font-size="23"
        fill="#e1e8eb">
    Ideas are easy. I build the real thing.
  </text>

  <text x="57" y="298"
        font-family="Arial,sans-serif" font-size="13"
        fill="#9db0bc" letter-spacing="1.5">
    AI SYSTEMS  /  SECURE INFRASTRUCTURE  /  PRODUCTS
  </text>

  <!-- Abstract systems diagram -->
  <g fill="none" stroke="#587483" stroke-width="1.5">
    <circle cx="1010" cy="165" r="119" opacity=".50"/>
    <circle cx="1010" cy="165" r="87" opacity=".65"/>
    <circle cx="1010" cy="165" r="47" opacity=".85"/>
    <path d="M866 165H1154M1010 20V310"
          stroke-dasharray="4 8" opacity=".42"/>
    <path d="M931 82L1072 226M944 240L1092 94"
          opacity=".32"/>
  </g>

  <!-- A quiet moving signal around the outer orbit. -->
  <g class="orbit-tracer" fill="#d7f58a">
    <circle cx="1129" cy="165" r="5"/>
    <circle cx="1128" cy="152" r="3" opacity=".45"/>
    <circle cx="1126" cy="141" r="2" opacity=".2"/>
  </g>

  <g fill="#d7f58a">
    <circle cx="1010" cy="165" r="7"/>
    <circle class="signal" cx="931" cy="82" r="5"/>
    <circle class="signal signal-delayed" cx="1092" cy="94" r="5"/>
    <circle cx="1072" cy="226" r="5"/>
  </g>

  <g font-family="Arial,sans-serif"
     font-size="12" letter-spacing="1.2"
     fill="#c5d2dc">
    <text x="857" y="70">RESEARCH</text>
    <text x="1099" y="85">SECURITY</text>
    <text x="1088" y="247">AGENTS</text>
  </g>

  <text x="1090" y="302"
        font-family="Arial,sans-serif" font-size="11"
        fill="#8a9eac" letter-spacing="2">
    NK-001
  </text>
</svg>
